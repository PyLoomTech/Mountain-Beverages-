<nav class="dash-nav">
  <a href="{% url 'dashboard:home' %}" class="{% if active == 'home' %}active{% endif %} mt-2">
    <i class="bi bi-grid"></i> Overview
  </a>

  <div class="heading">Website text</div>
  <a href="{% url 'dashboard:site' %}" class="{% if active == 'site' %}active{% endif %}">
    <i class="bi bi-pencil-square"></i> Site content
  </a>

  {% for group, sections in nav_groups.items %}
    <div class="heading">{{ group }}</div>
    {% for s in sections %}
      <a href="{% url 'dashboard:list' s.key %}" class="{% if active == s.key %}active{% endif %}">
        <i class="bi {{ s.icon }}"></i> {{ s.label }}
      </a>
    {% endfor %}
  {% endfor %}

  {% if user.is_superuser %}
    <div class="heading">Advanced</div>
    <a href="{% url 'admin:index' %}"><i class="bi bi-gear"></i> Django admin</a>
  {% endif %}
</nav>
