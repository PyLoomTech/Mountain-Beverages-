{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Dashboard{% endblock %} | {{ site.company_name }}</title>
  <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/trix@2.1.19/dist/trix.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
  <style>
    body { background: #f4f6fa; }
    .dash-top { background: var(--brand-navy); }
    .dash-aside { width: 260px; min-height: calc(100vh - 56px); background: var(--brand-navy); flex-shrink: 0; }
    .dash-offcanvas { background: var(--brand-navy); color: #fff; }
    .dash-nav .heading { color: rgba(255,255,255,.55); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; padding: 1rem 1rem .35rem; }
    .dash-nav a { display: block; color: rgba(255,255,255,.85); padding: .55rem 1rem; border-radius: .4rem; margin: 0 .5rem; text-decoration: none; }
    .dash-nav a:hover { background: rgba(255,255,255,.12); color: #fff; }
    .dash-nav a.active { background: var(--brand-blue); color: #fff; }
    .dash-nav a i { width: 1.4rem; display: inline-block; }
    .thumb { width: 48px; height: 48px; object-fit: cover; border-radius: .4rem; }
    .thumb-empty { width: 48px; height: 48px; border-radius: .4rem; background: #e9f2f8; color: var(--brand-blue); display: inline-flex; align-items: center; justify-content: center; }
    .form-preview { max-height: 120px; max-width: 100%; border-radius: .4rem; margin-bottom: .5rem; }
    .gallery-thumb { width: 100%; height: 120px; object-fit: cover; border-radius: .4rem; }
    /* Rich-text editor */
    trix-editor.trix-box { min-height: 320px; max-height: 70vh; overflow-y: auto; background: #fff; }
    trix-toolbar { margin-bottom: .5rem; }
    trix-toolbar .trix-button-group { background: #fff; }
    .trix-button-group--file-tools { display: none !important; } /* no file attachments */
  </style>
</head>
<body>

  <header class="dash-top navbar navbar-dark sticky-top px-3" style="height:56px;">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-light btn-sm d-lg-none" type="button"
              data-bs-toggle="offcanvas" data-bs-target="#dashMenu" aria-controls="dashMenu" aria-label="Open menu">
        <i class="bi bi-list"></i>
      </button>
      <a href="{% url 'dashboard:home' %}" class="navbar-brand mb-0 d-flex align-items-center">
        <i class="bi bi-speedometer2 me-2"></i> Dashboard
      </a>
    </div>
    <div class="d-flex align-items-center gap-2">
      <a href="{% url 'home' %}" target="_blank" rel="noopener" class="btn btn-outline-light btn-sm">
        <i class="bi bi-box-arrow-up-right"></i> <span class="d-none d-sm-inline">View site</span>
      </a>
      <form method="post" action="{% url 'logout' %}" class="m-0">
        {% csrf_token %}
        <button type="submit" class="btn btn-light btn-sm"><i class="bi bi-box-arrow-right"></i> <span class="d-none d-sm-inline">Logout</span></button>
      </form>
    </div>
  </header>

  <div class="d-flex">

    <!-- Sidebar (desktop) -->
    <aside class="dash-aside d-none d-lg-block pb-4">
      {% include "dashboard/_nav.html" %}
    </aside>

    <!-- Sidebar (phones and tablets) -->
    <div class="offcanvas offcanvas-start dash-offcanvas d-lg-none" tabindex="-1" id="dashMenu">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title"><i class="bi bi-speedometer2"></i> Dashboard</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body px-0">
        {% include "dashboard/_nav.html" %}
      </div>
    </div>

    <main class="flex-grow-1 p-3 p-lg-4" style="min-width:0;">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- Toast pop-ups (same system as the public site) -->
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
  <div id="server-messages" hidden>
    {% for message in messages %}
      <div data-level="{{ message.level_tag }}">{{ message }}</div>
    {% endfor %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/trix@2.1.19/dist/trix.umd.min.js"></script>
  <script src="{% static 'js/site.js' %}"></script>
  <script>
    // The editor only handles text: refuse pasted or dropped files
    document.addEventListener("trix-file-accept", function (event) { event.preventDefault(); });
  </script>
</body>
</html>
