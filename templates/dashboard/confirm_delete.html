{% extends "dashboard/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row">
  <div class="col-12 col-lg-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h1 class="h4"><i class="bi bi-exclamation-triangle-fill text-danger"></i> {{ title }}</h1>
        <p>You are about to delete <strong>“{{ obj }}”</strong>. This cannot be undone.</p>
        {% if hint %}<p class="text-muted small">{{ hint }}</p>{% endif %}
        <form method="post" class="d-flex gap-2">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Yes, delete</button>
          <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
