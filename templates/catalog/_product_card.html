<div class="card product-card h-100 shadow-sm">
  <a href="{% url 'product_detail' product.slug %}">
    {% if product.image %}
      <img src="{{ product.image.url }}" class="card-img-top product-img" alt="{{ product.name }}">
    {% else %}
      <div class="product-img placeholder-img d-flex align-items-center justify-content-center">
        <i class="bi bi-droplet fs-1"></i>
      </div>
    {% endif %}
  </a>
  <div class="card-body d-flex flex-column">
    <small class="text-muted">{{ product.category.name }}</small>
    <h5 class="card-title">
      <a href="{% url 'product_detail' product.slug %}" class="text-decoration-none text-dark">{{ product.name }}</a>
    </h5>
    <p class="card-text small text-muted">{{ product.short_description }}</p>
    <div class="mt-auto d-flex justify-content-between align-items-center">
      <span class="fw-bold text-primary">NPR {{ product.price|floatformat:2 }}</span>
      {% if product.is_available %}
        <span class="badge bg-success">Available</span>
      {% else %}
        <span class="badge bg-secondary">Unavailable</span>
      {% endif %}
    </div>
  </div>
</div>
