<div class="card h-100 shadow-sm product-card">
  <a href="{% url 'post_detail' post.slug %}">
    {% if post.cover_image %}
      <img src="{{ post.cover_image.url }}" class="card-img-top product-img" alt="{{ post.title }}">
    {% else %}
      <div class="product-img placeholder-img d-flex align-items-center justify-content-center">
        <i class="bi bi-newspaper fs-1"></i>
      </div>
    {% endif %}
  </a>
  <div class="card-body d-flex flex-column">
    <small class="text-muted"><i class="bi bi-calendar"></i> {{ post.published_at|date:"d M Y" }}</small>
    <h5 class="card-title mt-1">
      <a href="{% url 'post_detail' post.slug %}" class="text-decoration-none text-dark">{{ post.title }}</a>
    </h5>
    <p class="card-text small text-muted">{{ post.excerpt }}</p>
    <a href="{% url 'post_detail' post.slug %}" class="mt-auto small fw-semibold text-decoration-none">Read more <i class="bi bi-arrow-right"></i></a>
  </div>
</div>
