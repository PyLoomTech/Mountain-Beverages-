{% extends "base.html" %}

{% block title %}My Profile | {{ site.company_name }}{% endblock %}

{% block content %}
<section class="page-header text-white text-center py-5">
  <div class="container"><h1>My Profile</h1></div>
</section>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <p class="text-muted">Username: <strong>{{ user.username }}</strong></p>
          <form method="post" novalidate>
            {% csrf_token %}
            {% include "includes/_form_fields.html" %}
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a href="{% url 'order_list' %}" class="btn btn-outline-secondary">My Orders</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
