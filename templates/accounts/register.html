{% extends "base.html" %}

{% block title %}Register | {{ site.company_name }}{% endblock %}

{% block content %}
<section class="page-header text-white text-center py-5">
  <div class="container"><h1>Create Your Account</h1></div>
</section>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <form method="post" novalidate>
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {% include "includes/_form_fields.html" %}
            <button type="submit" class="btn btn-primary w-100 btn-lg">Register</button>
          </form>
          <p class="text-center mt-3 mb-0">
            Already have an account? <a href="{% url 'login' %}">Login</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
