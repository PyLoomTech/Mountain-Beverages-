{% extends "base.html" %}

{% block title %}Login | {{ site.company_name }}{% endblock %}

{% block content %}
<section class="page-header text-white text-center py-5">
  <div class="container"><h1>Customer Login</h1></div>
</section>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <form method="post" novalidate>
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            {% include "includes/_form_fields.html" %}
            <button type="submit" class="btn btn-primary w-100 btn-lg">Login</button>
          </form>
          <p class="text-center mt-3 mb-0">
            New customer?
            <a href="{% url 'register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Create an account</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
